<div *ngIf="lista">
	<div class="card-body">
		<p><strong>Descripción:</strong> {{ lista.descripcion }}</p>
		<p><strong>Fecha de creación:</strong> {{ lista.fechaCreacion | date:'dd/MM/yyyy' }}</p>
		
		<!-- Filtro de tareas -->
		<div class="filtros" *ngIf="lista.tareas.length > 0">
			<label for="filtroTareas" class="form-label mb-0"><strong>Filtrar tareas:</strong></label>
			<select id="filtroTareas" class="form-select form-select-sm w-auto" [(ngModel)]="filtroTareas" name="filtroTareas">
				<option value="todas">Todas</option>
				<option value="acabadas">Acabadas</option>
				<option value="noAcabadas">No acabadas</option>
			</select>
		</div>

		<div>
			<app-tarea
				*ngFor="let tarea of tareasFiltradas"
				[tarea]="tarea"
				(cambiarEstado)="toggleTareaAcabada(tarea)"
				(eliminarTarea)="eliminarTarea(tarea)">
			</app-tarea>
		</div>

		<div class="nueva-tarea" *ngIf="mostrarFormularioNuevaTarea; else botonNuevaTarea">
			<input
				type="text"
				class="form-control form-control-sm"
				placeholder="Escribe el nombre de la tarea"
				[(ngModel)]="nuevaTareaNombre"
				name="nuevaTareaNombre"
				(keyup.enter)="agregarTarea()">
			<div class="acciones-nueva-tarea">
				<button type="button" class="btn btn-sm btn-success" (click)="agregarTarea()">
					Crear tarea
				</button>
				<button type="button" class="btn btn-sm btn-secondary" (click)="cancelarNuevaTarea()">
					Cancelar
				</button>
			</div>
		</div>

		<div class="acciones-lista">
			<ng-template #botonNuevaTarea>
				<button type="button" class="add-tarea-button btn btn-sm" (click)="abrirFormularioNuevaTarea()">
					+ Añadir nueva tarea...
				</button>
			</ng-template>
			<button class="button btn btn-sm btn-primary" (click)="cerrar()">
				Ocultar detalle
			</button>
		</div>
	</div>
</div>
